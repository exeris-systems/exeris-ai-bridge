# Copy-paste detection is switched off for the diagnostic catalogue, and only
# for it.
#
# `src/tools/build/diagnostics.ts` is a lookup table: seventeen independent rows
# of prose, each describing one message a different part of the Exeris build
# prints. CPD sees seventeen object literals with the same key sequence and
# reports 92 duplicated lines, which is structurally true and semantically
# empty — the rule exists to catch copy-pasted LOGIC, where one fix has to be
# applied N times. No row here implies another: changing what
# `caps/dependency-cycle` says never means touching `processor/inert-attribute`.
# Row independence is the property that makes it a table.
#
# The alternative was to flatten each row into positional arguments, which is
# what would actually silence the token counter. That trades a real property —
# every field named at the site where it is written — for a metric, and buys a
# new failure mode: eight positional strings, four of them long prose, are
# swappable without the compiler noticing. A misordered `why` and `fix` would
# ship as confident, wrong advice.
#
# Scoped to the one file on purpose. Everything else, including the tests that
# hold the catalogue to real upstream messages, stays under the rule.
sonar.cpd.exclusions=src/tools/build/diagnostics.ts
