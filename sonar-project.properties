# The diagnostic catalogue is excluded from analysis. Only that file.
#
# `src/tools/build/diagnostics-catalogue.ts` holds seventeen independent rows
# of prose, each describing one message a different part of the Exeris build
# prints. It contains no logic — the behaviour that reads it lives next door in
# `diagnostics.ts`, which stays fully analysed, as do the tests that hold every
# row to a real upstream message.
#
# Copy-paste detection reports the rows as 92 duplicated lines, which is
# structurally true and semantically empty. The rule exists to catch duplicated
# LOGIC, where one fix has to be applied N times; no row here implies another,
# and that independence is what makes it a table rather than a function.
#
# The alternative was to flatten each row into positional arguments, which is
# what would actually silence the token counter. That trades a real property —
# every field named at the site where it is written — for a metric, and buys a
# new failure mode: eight positional strings, four of them long prose, are
# swappable without the compiler noticing, and a misordered `why` and `fix`
# would ship as confident, wrong advice.
sonar.exclusions=src/tools/build/diagnostics-catalogue.ts
