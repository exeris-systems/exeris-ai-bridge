# SonarQube Cloud analysis, driven from CI (.github/workflows/build.yml).
#
# This file is read only by a CI-based scan. SonarCloud's Automatic Analysis
# does not read it — verified on PR #30, where `sonar.cpd.exclusions` and then
# `sonar.exclusions` both left the reported measures untouched. Moving the scan
# into CI is what makes project configuration live in the project.

sonar.projectKey=exeris-systems_exeris-ai-bridge
sonar.organization=exeris-systems

# `main` is the new-code reference, matching exeris-kernel. A pull request is
# then measured against what it changes rather than against a sliding window.
sonar.newCode.referenceBranch=main

# TypeScript sources and the CI/release scripts, which are real code and carry
# the zero-checkout guarantee. `dist/` and `data/` are generated and never
# committed; node_modules is not ours.
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts

# Copy-paste detection is off for the diagnostic catalogue, and only for it.
#
# `src/tools/build/diagnostics-catalogue.ts` holds seventeen independent rows of
# prose, each describing one message a different part of the Exeris build
# prints. It contains no logic — the matcher that reads it lives in
# `diagnostics.ts`, which stays under every rule, as do the tests that hold each
# row to a real upstream message.
#
# CPD reports the rows as 92 duplicated lines. That is structurally true and
# semantically empty: the rule catches duplicated LOGIC, where one fix has to be
# applied N times, and no row here implies another. That independence is what
# makes it a table rather than a function.
#
# The alternative was to flatten each row into positional arguments, which is
# what would actually silence the token counter. It trades a real property —
# every field named at the site where it is written — for a metric, and buys a
# new failure mode: eight positional strings, four of them long prose, are
# swappable without the compiler noticing, and a misordered `why` and `fix`
# would ship as confident, wrong advice.
#
# Narrowed to the one rule rather than excluding the file: bugs, smells and
# security rules still apply to it.
sonar.cpd.exclusions=src/tools/build/diagnostics-catalogue.ts

# No coverage is imported, and the quality gate has no coverage condition.
# Importing it honestly needs work this file cannot do: `npm test` runs against
# `dist/`, so raw Node coverage would be attributed to emitted JavaScript that
# is not in sonar.sources — the "File not found in project sources" failure
# exeris-kernel hit — and mapping it back to TypeScript needs a source-map-aware
# coverage tool this repo does not yet depend on. Better absent than wrong.
