# Copy to <repo>/.github/workflows/guardrails.yml — the whole per-repo footprint of ADR-085 §C.11.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    #
    # `closed` is not a gate event and is here for one job: the judgement of ADR-087 §C.16, which
    # reads what the human did with the review once there is a history to read. EVERY OTHER JOB IN
    # THIS FILE SKIPS IT EXPLICITLY — see their `if:` lines. A gate on a pull request that can no
    # longer merge decides nothing, and the review job would otherwise run the model again on a
    # pull request whose review is over: its own trigger admits any event while the review label is
    # on the pull request, and closing one that still carries the label is such an event.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]
  # A PERSON'S APPROVAL IS A HUMAN REVIEW (ADR-087 §B.8), and it has to reach the required check as
  # an event of its own: the check is read from the newest run on the head commit, so an approval no
  # run follows would green nothing until something else happened. `dismissed` because withdrawing
  # one has to turn the check back. Every job runs on it, because the newest run is the one
  # the required checks are read from; the model does not start on one.
  pull_request_review:
    types: [submitted, dismissed]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`: when the review publishes it removes the review label, and that removal is an
  # `unlabeled` event whose run would cancel the run still publishing. Bot-triggered runs queue
  # instead of cancelling; human pushes still collapse. Measured on exeris-systems/.github#35, where
  # the cancel arrived in the same second the publishing job finished.
  #
  # AND NOT ON `closed`, which is why this file's `types:` list is read here as well. The close
  # joins the group of the run still working on that pull request, and the human who merges is no
  # `[bot]` — so without the first clause, merging as soon as the required check goes green cancels
  # the run that was publishing it and the judgement job that runs after it. Nothing reports such a
  # cancel: the capture step is suppressed with the run, and the judgement then reads an index with
  # no entry for the pull request and says, greenly, that there was nothing to judge.
  #
  # AND NOT ON A REVIEW, for the same reason from another side: a review changes no diff, so it has
  # nothing newer to put in place of the run already working, and approving beside a review that is
  # still running would otherwise cancel it. It queues instead, and reads the approval when it runs.
  cancel-in-progress: >-
    ${{ github.event.action != 'closed' && github.event_name != 'pull_request_review'
        && !endsWith(github.actor, '[bot]') }}
# A called workflow can only narrow the caller's permissions, never raise them, so this block must
# be the UNION of what every job below declares. It is not a wish list and it is not a minimum:
# omitting a permission one called workflow declares does not run that job with less, it makes the
# whole file an invalid workflow — "requesting 'issues: read, id-token: write', but is only allowed
# 'issues: none, id-token: none'", which is how exeris-kernel's first adoption of this file failed.
#
# Granting them here does not widen docs-lint, commit-lint or pr-body-check: each called workflow's
# jobs receive what its own permissions block declares, capped by this one. The last two belong to
# docs-review — `id-token: write` for the OIDC exchange claude-code-action performs, `issues: read`
# so the routine can see the debt issues of issue-conventions.md rule 6. Drop the `docs-review` job
# and you may drop them with it.
#
# `actions: read` belongs to `judge`, and it is the only permission in this block that the review
# itself does not need. The judgement compares the commit a review READ with the head the pull
# request ended at, and the first is the reviewing run's own `head_sha` — which the platform states
# on the Actions API and nowhere else that is independent of the row being judged. Drop the `judge`
# job and you may drop it with it.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  # `if: github.event.action != 'closed'` ON EVERY GATE JOB, for the reason the trigger list gives:
  # this file listens to `closed` for the judgement job alone, and a gate that ran on it would
  # report a check on a pull request that can no longer merge.
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      mode: ramp                # switch to strict per repo once the frontmatter backfill has landed
      section-check: false      # enable after subsystem/module pages carry the required sections
      # No path list: docs-lint reads the whole repository and skips what is not documentation
      # (generated output, agent trees, "_"-prefixed working directories). Name a path here only
      # to take something out — a vendored tree, say:
      # exclude: "docs/vendor"
  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # The L2 review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  # Without this job the routine runs only in Cowork sessions and never on a pull request.
  #
  # ONE JOB BY DEFAULT: `produce` runs the model and posts its review, exactly as before the split.
  # Publication is opt-in (`publish: true` below), and until you turn it on nothing is labelled and
  # nothing is gated — which is deliberate, because whether the runner writes a verdict file at all
  # is ADR-087 Engineering Protocol 4's open question and `exeris-systems/.github` answers it on
  # itself first.
  #
  # With `publish: true` a second job appears and IS THE REQUIRED CHECK — red when the verdict is
  # absent, invalid, BLOCKED, or rests on a mandatory gate that did not run. The produce job is
  # never the required one, because a review that crashed has to reach the step that notices.
  #
  # THE CHECK NAME THEN HAS THREE SEGMENTS, because the publish half is its own reusable workflow:
  # `docs-review / publish / verdict`. CONFIRM IT AGAINST A REAL RUN before adding it to a branch
  # protection rule — a required check whose name does not exist never reports, and a pull request
  # waiting on one can never merge. Without `publish: true` the only check this job contributes is
  # `docs-review / produce`.
  #
  # Secrets are named rather than inherited, matching exeris-kernel and exeris-sdk, which both
  # refused `secrets: inherit` under SonarCloud S7631. The two EXERIS_BOT_* lines are optional: drop
  # them and the review still runs, it is simply not published under the organisation's identity
  # and no label moves — and with `publish: true` but no secrets, the gate still decides while
  # nothing is posted. The permission block above does not grow either way
  # — every write goes through the App's installation token, so neither job's own GITHUB_TOKEN holds
  # one (ADR-087 §B.5).
  # `needs` puts the review after the gates it is meant to complement, and `l1-results` hands it
  # their conclusions. Without the second, the reviewer tries to read a CI step summary, its harness
  # denies the network call, and every mandatory gate lands in the verdict as `not-run` — which the
  # publish step correctly turns red, for ever, on every pull request.
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, reopened,
  # marked ready for review, or labelled `needs-l2-review` by a human. A push afterwards does not
  # start a new one — it leaves the standing verdict visibly covering an older commit, and the
  # required check goes red saying so until a review is asked for again. That is deliberate: a
  # verdict is about the tree it read, and a green check resting on a review of code that is gone is
  # worse than a red one.
  docs-review:
    needs: [docs, commits, pr-body]
    #
    # ON EVERY EVENT THAT IS NOT `closed`, A BOT'S INCLUDED. A required check is read from the NEWEST
    # run of this workflow on the head commit, so a run in which this job is skipped reports no
    # verdict at all, and the pull request waits on a status that will never arrive — however
    # green the runs before it were. The publisher applies and removes labels, each removal is an
    # event, and every such event must therefore carry the verdict job. The model is not woken by
    # one: the called workflow's producing job refuses a non-human sender on its own, and the
    # publishing half answers such an event from the standing verdict or the standing human review.
    #
    # `always()` stands for the same reason: a review that vanishes from the checks because its
    # gates went red is the failure mode this file exists to prevent.
    #
    # AND NOT ON `closed`. The condition below admits any event while the review label is on the
    # pull request, and closing one that still carries it is such an event — so without this the
    # model runs again on a pull request whose review is over and whose check decides nothing.
    if: ${{ always() && github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@main
    with:
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's step of the review, and the checks the reviewer reads as its output: the
      # compiler, the type-aware lint and the unit suite, the same three build.yml runs.
      repo-routine: docs/repo-review-rules.md
      repo-checks: npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm test
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      # THE PEN, AND IT IS ONE EDIT WITH `capture: true` BELOW. A caller may pass only a secret the
      # called workflow DECLARES: one it does not declare is not ignored, it makes the whole file an
      # invalid workflow in the adopting repository, on the first push, with no logs — taking every
      # gate in this file down with it, not only this job. That is the same failure the permission
      # block above exists for. So these two go live in the same change that turns capture on.
      #
      # They are optional exactly as the two lines above are: an organisation secret that is not set
      # arrives as an empty string, and the capture job then says so and writes nothing. They are
      # named rather than inherited for the reason the others are.
      # exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      # exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
    # with:
    #   # PUBLICATION IS OFF BY DEFAULT. Turn it on once `exeris-systems/.github` has run the review
    #   # on itself and answered ADR-087 Engineering Protocol 4 — whether the runner writes a
    #   # verdict file, and what identity it posts under. Until then this job produces a review and
    #   # publishes nothing, which is what it did before the split.
    #   publish: true
    #   # CAPTURE IS THE SECOND OPT-IN, and a separate decision from the first. With it on, the run
    #   # becomes a row in the organisation's execution dataset (ADR-087 §C.13-§C.17): the runner's
    #   # execution log is committed to the streams repository as content, a run record is assembled
    #   # from what the producing job exported about itself, and the day's rows reach the inbox as
    #   # one pull request per repository per day. Turn it on after reading rows a producer has
    #   # already written — a repository that starts contributing to a dataset should have seen what
    #   # it will be contributing.
    #   #
    #   # IT RUNS INSIDE THE PUBLISHING HALF, so it needs `publish: true` as well: with publication
    #   # off there is no job for it to be a part of, and `capture: true` alone runs nothing and
    #   # says nothing about having run nothing.
    #   #
    #   # It needs the two EXERIS_INBOX_* secrets in the block above — uncomment them in the same
    #   # edit — and NO new permission: the capture job reads the repository and the pull request,
    #   # both of which the block at the top already grants, and every write goes through the App's
    #   # installation token. Without the secrets the job reports that it has no identity to write
    #   # under and writes nothing; the review and its gate are unaffected either way.
    #   capture: true
    #   # Which runner produces the verdict. One value is supported today; it is recorded, never
    #   # selected — ADR-087 §B.12.
    #   runner: claude-code-action
    #   # L1 gates whose `not-run` makes the required check red, beyond the routine's own three
    #   # (docs-lint, commit-lint, pr-body-check). Name a repo's own mandatory gates here.
    #   mandatory-gates: "docs-lint,commit-lint,pr-body-check,javadoc-gate"
    #   # THIS REPOSITORY'S OWN REVIEW RULES, if it has any. The point of these two is that having
    #   # rules of your own is no longer a reason to keep a review workflow of your own — which is
    #   # how every repository ended up with a second verdict format, no required check and no
    #   # provenance. The shared routine's `## Repository extension` section owns the limits: an
    #   # extension adds checks and raises severities, it never lowers one, skips a step, or changes
    #   # the output format.
    #   repo-routine: .agents/workflows/docs-pr-review.md
    #   # Scripts CI runs for the reviewer before the model starts, their output handed over as a
    #   # file. CI runs them because the runner's harness denies Bash — asking the model to execute
    #   # them gets a review that reports its own checks as `not-run`. A non-zero exit never fails
    #   # the job: a candidate locator that found candidates is evidence, not a verdict.
    #   # Separated by `;`, NOT by `&&`: a candidate locator exits non-zero when it FINDS
    #   # something, so `&&` would stop the list at the first script that had anything to say.
    #   repo-checks: .agents/scripts/drift-sweep.sh; .agents/scripts/taxonomy-check.sh
  # THE OTHER HALF OF THE ROW, AND THE ONLY JOB IN THIS FILE THAT RUNS ON `closed`. A review-domain
  # run record is complete when the review ends and its outcome is `UNKNOWN`: the oracle has not
  # judged yet. `review-disposition` judges when the pull request closes — per finding, from what
  # the human did with it — and its verdict is appended as its OWN record keyed by the run's id
  # (ADR-087 §C.16, ADR-086 §C.12a). The run record is never touched.
  #
  # IT IS NOT A GATE. The pull request is closed; nothing this job concludes can change what merged.
  # It publishes no check a branch protection rule can name, and it posts nothing to the pull
  # request.
  #
  # IT TURNS ON WITH CAPTURE, not separately: it judges rows, so with capture off there are no rows
  # for it to judge and it says so and writes nothing. It needs the same two EXERIS_INBOX_* secrets
  # — uncomment them here in the same edit that uncomments them above — and `actions: read` in the
  # permission block at the top, which is the one permission the review itself does not need.
  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      # exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      # exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
  # javadoc:                    # JVM repos with a gated module only
  #   uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@main
  #   with:
  #     # Gated in full — every file complies, always. Rule 11's exception: the surfaces a
  #     # downstream implementor reads. These modules need java/javadoc-plugin-block.xml in
  #     # their own pom.
  #     modules: "exeris-kernel-spi,exeris-kernel-tck"
  #     # Gated on the changed files of this pull request, which is what javadoc-conventions.md
  #     # rule 11 says for Kernel Core, Community and tooling: no backfill mandate, but a file you
  #     # touch has to comply. Needs no pom change, so a module can go under the gate long before
  #     # it is clean.
  #     diff-modules: "exeris-kernel-core,exeris-kernel-community"
  #     # Built so the gated modules compile, never audited. `-am` cannot find these: an annotation
  #     # processor reaches its consumer through <annotationProcessorPaths>, which is not a reactor
  #     # edge, so the install step dies on a missing artifact unless the module is named here.
  #     # build-modules: "exeris-sdk-annotation-catalog"
  # tsdoc:                      # TypeScript packages only — ONE JOB PER PACKAGE, the gate's unit is a package
  #   uses: exeris-systems/.github/.github/workflows/tsdoc-gate.yml@main
  #   # The three targets and the settings each one takes. `typedoc` and `api-report` stay off until
  #   # that package commits the config and the golden they read; the lint half runs from day one.
  #   with: { package-dir: ".", typedoc: true, api-report: "mcp-tool-surface" }                 # exeris-ai-bridge
  #   with: { package-dir: "exeris-sdk-ui-kit", typedoc: true, api-report: "api-extractor" }    # exeris-sdk
  #   with: { package-dir: "exeris-codegen-ts", typedoc: true }                                 # exeris-tooling
