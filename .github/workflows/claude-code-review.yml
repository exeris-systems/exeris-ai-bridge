name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. The repo is `exeris-ai-bridge`, a TypeScript / Node 20+
            Model Context Protocol (MCP) server in the Exeris open-core stack. It is
            the *server* side of MCP and publishes three read-only tool families
            (`docs:*`, `lsp:*`, `kernel:*`). The founding decision is ADR-025; the
            constraints below are load-bearing and non-negotiable.

            Focus on:
            1. **ADR-025 hard constraints** — flag ANY violation as a blocker:
               - The Wall (ADR-006): no Java-kernel classpath linkage. Kernel access
                 is process-boundary only (JSON-over-stdio). No GraalVM/JNI/JNR.
               - No model API: never `@anthropic-ai/sdk`, `openai`, or any LLM SDK /
                 API key. The LLM lives in the client, not here.
               - Read-only: `kernel:*`, `docs:*`, `lsp:*` must not mutate state.
                 Refuse any tool that restarts/swaps/writes.
               - Not a capability: no `@Provides`/`@Requires`, no composition manifest.
               - License stays Apache-2.0 (no Commons Clause / BSL).
            2. **Tool-family discipline** — tools stay within `docs:*` / `lsp:*` /
               `kernel:*`; no new family without an ADR-025 amendment; no cross-family
               leakage. Handlers live next to their `register<Family>Tools()`.
            3. **Path sandboxing** — filesystem reads (`docs:*` → `../exeris-docs/`)
               must resolve under a pinned root and reject paths escaping it. No
               agent-supplied absolute paths. No `eval` / `new Function` / dynamic
               `require` of agent-controlled strings.
            4. **Correctness** — bugs, edge cases, broken contracts, unhandled
               rejections, merge artifacts (duplicated sections, orphan blocks).
            5. **TypeScript hygiene** — strict mode stays on; `noUnusedLocals`,
               `noUnusedParameters`, `noImplicitReturns` not weakened; any
               `@ts-ignore` justified by a comment.
            6. **Risk** — call out functional, security, performance risks explicitly
               (state "none" if applicable; don't pad).

            Skip cosmetic nits unless they affect the above. Be specific: cite
            `file:line`. Lead with blockers, then in-scope improvements, then
            non-blocking suggestions. End with a clear verdict
            (LGTM / Approve with nits / Request changes).

            Post your review as a single PR review (not many separate comments).
            Use inline comments only when they materially help — file:line in the
            text body is usually clearer.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(git remote:*)"
